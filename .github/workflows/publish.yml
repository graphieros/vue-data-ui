name: Publish Package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - run: npm ci

            - name: Install browser test dependencies
              run: npx playwright install --with-deps chromium

            - name: Unit and Storybook interaction tests
              run: npm run test:all

            - name: Build Storybook
              run: npm run build:storybook

            - run: npm run pubprod

            - name: Publish
              run: |
                  TAG=$(node -p "const version = require('./package.json').version; const prerelease = version.match(/-(.+?)(\.|$)/); prerelease ? prerelease[1] : 'latest'")
                  npm publish --tag "$TAG"
